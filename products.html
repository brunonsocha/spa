<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Products</title>
</head>
<body>
  <div id="app">
    <label>Produkt:</label>
    <input type="text" v-model="productFilter">

    <table border="1">
      <thead>
        <tr>
          <th>nazwa produktu</th>
          <th>cena jednostkowa</th>
          <th>ilość</th>
          <th>wartość</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="product in filteredProducts" :key="product.name">
          <td>{{ product.name }}</td>
          <td>{{ product.price }} zł</td>
          <td>{{ product.quantity }}</td>
          <td>{{ product.price * product.quantity }} zł</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const { createApp, ref, computed } = Vue

    createApp({
      setup() {
        const productFilter = ref('')

        const products = ref([
          { name: 'zeszyt czarny', price: 17, quantity: 3 },
          { name: 'ołówek', price: 4, quantity: 10 },
          { name: 'zeszyt zielony', price: 12, quantity: 5 },
          { name: 'długopis czarny', price: 2, quantity: 8 }
        ])

        const filteredProducts = computed(() => {
          return products.value.filter(product =>
            product.name.toLowerCase().includes(productFilter.value.toLowerCase())
          )
        })

        return { productFilter, filteredProducts }
      }
    }).mount('#app')
  </script>
</body>
</html>
