<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Product</title>
    <style>
        #app {
            font-family: "Courier New";
        }
        .bold {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="bold">{{ receipt.title }}</div>
        <div>-------------------</div>
        <div>Product: {{ receipt.product }}</div>
        <div>Unit Price: {{ receipt.price }} zł</div>
        <div>Quantity: {{ receipt.quantity }}</div>
        <div>Amount: {{ amount }} zł</div>
        <div>VAT Tax Rate: {{ receipt.vatRate }}%</div>
        <div>===================</div>
        <div class="bold">Total: {{ total }} zł</div>
    </div>
    <script>
      const { createApp, ref, computed } = Vue
      createApp({
        setup() {
          const receipt = ref({
            title: "RECEIPT",
            product: "book",
            price: 17,
            quantity: 3,
            vatRate: 23
          })
          const amount = computed(() => receipt.value.price * receipt.value.quantity)

          const total = computed(() => {
            const tax = amount.value * (receipt.value.vatRate / 100);
            return (amount.value + tax).toFixed(2);
          })
          
          return { receipt, amount, total }
        }
      }).mount('#app')
    </script>
</body>
</html>
