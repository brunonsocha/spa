<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizytówka Firmy</title>
    <style>
        #app {
            display: flex;
            justify-content: center;
            padding-top: 50px;
            font-family: Arial, sans-serif;
        }
        .card {
            border: 1px solid #000000;
            padding: 20px 40px;
            max-width: 350px;
            text-align: center;
            background-color: #FFFFFF;
        }
        .company-name {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .link {
            color: #0066CC;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="card">
            <span class="company-name">{{ company.name }}</span>
            <div>{{ company.street }}</div>
            <div>{{ company.city }}</div>
            <div>tel. {{ company.phone }}</div>
            <a :href="company.website" class="link">{{ company.website }}</a>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const company = ref({
                    name: "Unikpol S.A.",
                    street: "ul. Ukryta 5",
                    city: "02-114 Rawa Mazowiecka",
                    phone: "22 345 90 21, 888 213 992",
                    website: "http://www.unikpol.pl"
                });

                return {
                    company
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
